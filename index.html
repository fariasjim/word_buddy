<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBuddy UI</title>
    <style>
        @font-face {
            font-family: 'monofur Nerd Font';
            src: url('assets/Monofur.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-sidebar: #212121;
            --bg-tab-active: #1f538d;
            --bg-tab-hover: #2c2c2c;
            --btn-blue: #1f538d;
            --btn-blue-hover: #2a72c1;
            --btn-gray: #2b2b2b;
            --btn-gray-hover: #3a3a3a;
            --text-main: #ffffff;
            --text-muted: #9e9e9e;
            --font-family-global: 'monofur Nerd Font', 'Monofur', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-global); /* Dynamically maps to Monofur */
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Window Dimensions: Exact 700x630 Tkinter Map */
        .window-container {
            width: 700px;
            height: 630px;
            background-color: var(--bg-main);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Work Area: 600px */
        .main-workspace {
            display: flex;
            height: 600px;
            width: 100%;
        }

        /* Sidebar/Image Frame Section */
        .sidebar-area {
            width: 400px;
            height: 100%;
            background-image: url('assets/1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            border-right: 1px solid #151515;
            position: relative;
        }

        .app-logo-fallback {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #2b2b2b, #151515);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 25px;
            border: 1px solid #333;
        }

        .sidebar-title {
            color: var(--text-main);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Configuration Panel Space */
        .panel-area {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* CustomTkinter Tab Segments */
        .tab-navigation {
            display: flex;
            background-color: #151515;
            padding: 5px 10px 0 10px;
            gap: 4px;
        }

        .tab-item {
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
        }

        .tab-item.active {
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* Inside Content Grid */
        .tab-content-viewport {
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            height: calc(100% - 36px);
        }

        .view-header {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 35px;
        }

        /* Control Input File Rows */
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .row-label {
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
        }

        .ctk-btn {
            border: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.1s;
        }

        .btn-browse {
            background-color: var(--btn-gray);
            width: 110px;
            height: 32px;
        }

        .btn-browse:hover {
            background-color: var(--btn-gray-hover);
        }

        .path-indicator {
            color: var(--text-muted);
            font-size: 12px;
            text-align: right;
            margin-bottom: 25px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 2px;
        }

        /* Toggle Option Switches */
        .options-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 45px;
        }

        .switch-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .switch-container input {
            display: none;
        }

        .switch-slider {
            width: 44px;
            height: 22px;
            background-color: #454545;
            border-radius: 11px;
            margin-right: 14px;
            position: relative;
            transition: background-color 0.2s;
        }

        .switch-slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .switch-container input:checked + .switch-slider {
            background-color: var(--btn-blue);
        }

        .switch-container input:checked + .switch-slider::before {
            transform: translateX(22px);
        }

        .switch-label {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
        }

        /* Submit Action Engine */
        .btn-action-trigger {
            background-color: var(--btn-blue);
            width: 100%;
            height: 48px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 8px;
            margin-top: auto;
        }

        .btn-action-trigger:hover {
            background-color: var(--btn-blue-hover);
        }

        /* Footer Section: Exact 30px Height */
        .window-footer {
            height: 30px;
            width: 100%;
            background-color: var(--bg-sidebar);
            border-top: 1px solid #151515;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 12px;
        }

        .version-tag {
            background-color: var(--text-main);
            color: #000000;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="window-container">
        
        <div class="main-workspace">
            
            <div class="sidebar-area">
            </div>

            <div class="panel-area">
                <div class="tab-navigation">
                    <button class="tab-item active">UnicodeToAsci</button>
                </div>

                <div class="tab-content-viewport">
                    <h2 class="view-header">Unicode to ASCII converter</h2>

                    <div class="control-row">
                        <span class="row-label">Open Path</span>
                        <button class="ctk-btn btn-browse" onclick="triggerFilePicker('open')">Browse</button>
                    </div>
                    <div id="open-path-text" class="path-indicator">No file selected</div>

                    <div class="control-row">
                        <span class="row-label">Save Path</span>
                        <button class="ctk-btn btn-browse" onclick="triggerFilePicker('save')">Browse</button>
                    </div>
                    <div id="save-path-text" class="path-indicator">No path assigned</div>

                    <div class="options-stack">
                        <label class="switch-container">
                            <input type="checkbox" id="switch-overwrite" checked>
                            <span class="switch-slider"></span>
                            <span class="switch-label">Overwrite same file</span>
                        </label>

                        <label class="switch-container">
                            <input type="checkbox" id="switch-open" checked>
                            <span class="switch-slider"></span>
                            <span class="switch-label">Open file after conversion</span>
                        </label>

                        <label class="switch-container">
                            <input type="checkbox" id="switch-highlight" checked>
                            <span class="switch-slider"></span>
                            <span class="switch-label">Converted text highlight</span>
                        </label>
                    </div>

                    <button class="ctk-btn btn-action-trigger" onclick="executeConversion()">CONVERT</button>
                </div>
            </div>

        </div>

        <footer class="window-footer">
            <span class="footer-text">Developed by: Farias Hamid Jim</span>
            <span class="footer-text">All rights reserved</span>
            <span class="version-tag">Version: 1.1</span>
        </footer>

    </div>

    <input type="file" id="system-file-bridge" accept=".docx,.txt" style="display: none;">

    <script>
        let currentTargetMode = '';

        function triggerFilePicker(mode) {
            currentTargetMode = mode;
            document.getElementById('system-file-bridge').click();
        }

        document.getElementById('system-file-bridge').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const filename = e.target.files[0].name;
                if (currentTargetMode === 'open') {
                    document.getElementById('open-path-text').textContent = filename;
                } else if (currentTargetMode === 'save') {
                    document.getElementById('save-path-text').textContent = "Target folder: /" + filename;
                }
            }
        });

        function executeConversion() {
            console.log("Conversion triggered.");
        }
    </script>
</body>
</html>
